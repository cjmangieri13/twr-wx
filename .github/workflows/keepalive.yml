# GitHub disables scheduled workflows in a public repo after 60 days with no activity.
# Once a week: if the last commit is over 45 days old, commit a heartbeat.
name: keepalive
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "last commit $age days ago"
          if [ "$age" -gt 45 ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "twr-wx keepalive"
            git config user.email "actions@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push
          fi
