# ECMWF, checked hourly (00z and 12z runs land ~7-9 h later; an unchanged run exits in seconds)
name: ecmwf
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this run is already published"
        type: boolean
        default: false
concurrency:
  group: ecmwf
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: twr-public
          PYTHONFAULTHANDLER: "1"
        # On failure, the last 40 log lines become a public annotation (run logs need a GitHub login to read).
        run: |
          set -o pipefail
          python -m wx ecmwf ${{ inputs.force && '--force' || '' }} 2>&1 | tee run.log || {
            code=$?
            echo "::error title=ecmwf failed (exit $code)::$(tail -40 run.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit $code
          }
